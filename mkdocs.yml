site_name: Packer for Mere Mortals
site_description: Build identical machine images from one written template instead of setting up every machine by hand. Templates, builders, provisioners and variables, one complete build run and proved end to end on a machine with no cloud account and no hypervisor, and the real builders surveyed honestly, with the limits stated plainly.
